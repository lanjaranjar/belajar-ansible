<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Halaman Tidak Aktif</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      padding: 48px 40px;
      max-width: 480px;
      width: 90%;
      text-align: center;
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 22px; color: #c0392b; margin-bottom: 12px; }
    p { color: #555; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
    .new-url {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 14px;
      color: #333;
      word-break: break-all;
      margin-bottom: 28px;
    }
    .new-url span { font-weight: 600; color: #1a73e8; }
    .btn {
      display: inline-block;
      background: #1a73e8;
      color: #fff;
      text-decoration: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: #1558b0; }
    .footer { margin-top: 28px; font-size: 12px; color: #aaa; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">⚠️</div>
    <h1>Alamat Ini Sudah Tidak Aktif</h1>
    <p>
      Halaman yang Anda akses sudah tidak tersedia.<br>
      Silakan gunakan alamat baru kami di bawah ini.
    </p>
    <div class="new-url">
      Alamat baru: <span>https://sb.sellparker.com.au</span>
    </div>
    <a class="btn" href="https://sb.sellparker.com.au">Buka Halaman Baru</a>
    <div class="footer">Sellparker &mdash; Terima kasih atas pengertian Anda.</d                                                                                                                                                             iv>
  </div>
</body>
</html>
